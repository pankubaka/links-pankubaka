<style>
/* Layout: one narrow column — night-race pixel scene on top, tabbed link list below. Single dark arcade look by choice. */
:root{
  --night:#120f1f;      /* page */
  --panel:#1c1830;      /* cards */
  --line:#3a3358;       /* pixel borders */
  --ink:#f3eee6;        /* text */
  --muted:#a59cc0;      /* secondary */
  --red:#e0352b;        /* brand red (cap, logo) */
  --track:#b8442e;      /* tartan track */
  --mint:#5fd39a;       /* positive / code */
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding:24px 16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

.draft{font:600 12px/1.3 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--night);background:#f2c14e;padding:6px 10px;text-align:center}

.stage{position:relative;border:3px solid var(--line);background:#0b0916;box-shadow:6px 6px 0 #000}
.stage canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:8px;padding:6px 8px;font:600 12px/1 var(--f-display);letter-spacing:.04em;color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000;pointer-events:none;font-variant-numeric:tabular-nums}
.hud-mode{position:absolute;right:8px;bottom:5px;font:400 11px/1 var(--f-display);letter-spacing:.05em;color:#fff;opacity:.85;text-shadow:1px 1px 0 #000;pointer-events:none}
.pause{position:absolute;left:6px;bottom:6px;font:600 11px/1 var(--f-display);letter-spacing:.05em;color:#fff;background:rgba(20,15,28,.75);border:2px solid #000;padding:5px 7px;cursor:pointer}
.pause:hover{background:var(--red)}
.pause:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
.paused-label{position:absolute;inset:0;display:grid;place-items:center;font:700 26px var(--f-display);letter-spacing:.1em;color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none}
.egg{position:absolute;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-align:center;padding-inline:12px}
.egg b{font:700 clamp(18px,5vw,30px)/1 var(--f-display);letter-spacing:.06em;color:#ffe066;text-shadow:2px 2px 0 #7a3d00,-2px -2px 0 #000,4px 4px 0 #000;animation:flash .5s steps(2) infinite}
.egg span{font:600 12px var(--f-display);letter-spacing:.06em;color:#fff;text-shadow:1px 1px 0 #000;background:rgba(0,0,0,.45);padding:3px 6px}
@keyframes flash{50%{color:#fff6c2}}
@media (prefers-reduced-motion:reduce){.egg b{animation:none}}
.stage canvas:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}

.id{display:flex;gap:14px;align-items:center}
.avatar{width:72px;height:72px;flex:none;background:var(--red);border:3px solid #000;image-rendering:pixelated}
.avatar.photo{object-fit:cover;image-rendering:auto}
.id h1{font:700 30px/1 var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
.id p{margin:6px 0 0;color:var(--muted);font-size:15px}
.id div{min-width:0}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1 1 0;min-width:96px;font:600 15px var(--f-display);letter-spacing:.03em;color:var(--muted);background:var(--panel);border:3px solid var(--line);padding:10px 8px;cursor:pointer;touch-action:manipulation}
.tab[aria-selected="true"]{color:#fff;background:var(--red);border-color:#000;box-shadow:3px 3px 0 #000;transform:translate(-2px,-2px)}
.tab:focus-visible,.link:focus-visible,.copy:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}

.note{font-size:13px;color:var(--muted);margin:0;border-left:3px solid var(--line);padding-left:10px}
.list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.item{display:flex;gap:0;background:var(--panel);border:3px solid var(--line);transition:transform .08s,box-shadow .08s}
.item:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 #000;border-color:#000}
.link{flex:1;min-width:0;display:flex;gap:12px;align-items:center;padding:12px 14px;color:inherit;text-decoration:none}
.ico{flex:none;width:36px;height:36px;display:grid;place-items:center;font:700 14px var(--f-display);color:#fff;border:2px solid #000}
.txt{min-width:0;flex:1}
.t{font-weight:700;display:block}
.s{font-size:14px;color:var(--muted);display:block}
.badge{display:inline-block;font:600 10px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:3px 5px;margin-left:6px;vertical-align:2px;border:1px solid currentColor}
.badge.aff{color:#f2c14e}
.badge.new{color:var(--mint)}
.arrow{font:700 18px var(--f-display);color:var(--muted);flex:none}
.video .link{flex-direction:column;align-items:stretch;padding:0;gap:0}
.thumb{position:relative;display:block;aspect-ratio:16/9;max-width:100%;background:#000;border-bottom:3px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 20px var(--f-display);color:#fff;background:var(--red);border:3px solid #000;padding:8px 14px 8px 16px;box-shadow:3px 3px 0 #000}
.vrow{display:flex;gap:12px;align-items:center;padding:12px 14px}
.copy{flex:none;font:600 13px var(--f-display);letter-spacing:.04em;color:var(--mint);background:transparent;border:0;border-left:3px dashed var(--line);padding:0 14px;cursor:pointer;min-width:96px}
.copy small{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em}

footer{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;font-size:13px;color:var(--muted);border-top:3px solid var(--line);padding-top:14px}
footer b{color:var(--ink);font-weight:400;user-select:all}

@media (prefers-reduced-motion:reduce){.item,.item:hover{transition:none;transform:none}}
</style>

<div class="wrap">

  <div class="stage">
    <canvas id="scene" tabindex="0" aria-label="8-bitowy Kuba biegnie maraton; kliknij lub naciśnij spację, żeby przeskoczyć przeszkodę"></canvas>
    <div class="hud"><span id="hud-km">KM 0,0 / 42,195</span><span id="hud-clock"></span></div>

    <span>pankubaka.pl</span>

</div>

<script src="/links.js"></script>
<script>
/* ===== TREŚCI — edytuj tutaj ===== */
const SECTIONS=window.SECTIONS;

/* ===== Statystyki (bez cookies) ===== */
function track(type,id,extra){
  try{
    const body=JSON.stringify(Object.assign({type,id},extra||{}));
    if(!(navigator.sendBeacon&&navigator.sendBeacon('/api/track',new Blob([body],{type:'text/plain'}))))
      fetch('/api/track',{method:'POST',body,keepalive:true}).catch(()=>{});
  }catch(e){}
}
(()=>{const q=new URLSearchParams(location.search);let ref=q.get('ref')||q.get('utm_source')||'';
  if(!ref&&document.referrer){try{const h=new URL(document.referrer).hostname;if(h!==location.hostname)ref=h}catch(e){}}
  track('view',null,{ref})})();

/* ID filmu z dowolnego linku YouTube (watch, youtu.be, shorts, live, embed) */
function ytId(u){
  if(!u)return null;
  const m=String(u).match(/(?:youtu\.be\/|[?&]v=|\/(?:shorts|live|embed)\/)([\w-]{11})/);
  return m?m[1]:null;
}
/* ===== Zakładki i lista ===== */
const tabsEl=document.getElementById('tabs'), listEl=document.getElementById('list'), noteEl=document.getElementById('note');
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function render(id){
  const sec=SECTIONS.find(s=>s.id===id)||SECTIONS[0];
  [...tabsEl.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.id===sec.id));
  noteEl.hidden=!sec.note; noteEl.textContent=sec.note||'';
  listEl.innerHTML=sec.items.map((it,i)=>{
    const vid=ytId(it.yt);
    if(vid)return `
    <li class="item video">
      <a class="link" data-lid="${linkId(sec,it)}" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">
        <span class="thumb"><img alt="" loading="lazy" src="https://i.ytimg.com/vi/${vid}/maxresdefault.jpg" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='https://i.ytimg.com/vi/${vid}/hqdefault.jpg'}else{this.parentNode.hidden=true}"><span class="play">▶</span></span>
        <span class="vrow"><span class="ico" style="background:${it.c}">${esc(it.ico)}</span>
        <span class="txt"><span class="t">${esc(it.t)}</span><span class="s">${esc(it.s2||'Obejrzyj na YouTube')}</span></span>
        <span class="arrow">›</span></span>
      </a>
    </li>`;
    return `
    <li class="item">
      <a class="link" data-lid="${linkId(sec,it)}" href="${esc(it.url)}" target="_blank" rel="noopener${it.badge&&it.badge[0]==='aff'?' sponsored':''}">
        <span class="ico" style="background:${it.c}">${esc(it.ico)}</span>
        <span class="txt"><span class="t">${esc(it.t)}${it.badge?`<span class="badge ${it.badge[0]}">${esc(it.badge[1])}</span>`:''}</span><span class="s">${esc(it.s)}</span></span>
        <span class="arrow">›</span>
      </a>
      ${it.code?`<button class="copy" id="copy-${sec.id}-${i}" data-lid="${linkId(sec,it)}" data-code="${esc(it.code)}"><small>KOD</small>${esc(it.code)}</button>`:''}
    </li>`}).join('');
  try{localStorage.setItem('tab',sec.id)}catch(e){}
}
SECTIONS.forEach(s=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.id='tab-'+s.id;b.dataset.id=s.id;b.textContent=s.label;b.onclick=()=>render(s.id);tabsEl.appendChild(b)});
listEl.addEventListener('click',e=>{
  const a=e.target.closest('a.link'); if(a&&a.getAttribute('href')==='#'){e.preventDefault();return}
  if(a){track('click',a.dataset.lid);return}
  const c=e.target.closest('.copy'); if(!c)return;
  track('copy',c.dataset.lid);
  const code=c.dataset.code, done=()=>{c.innerHTML='<small>SKOPIOWANO</small>'+esc(code);setTimeout(()=>c.innerHTML='<small>KOD</small>'+esc(code),1400)};
  try{navigator.clipboard.writeText(code).then(done,()=>{})}catch(err){}
});
let start=location.hash.slice(1); if(!SECTIONS.some(s=>s.id===start)){try{start=localStorage.getItem('tab')}catch(e){start=null}}
render(start||'sociale');

/* Najnowszy film z kanału (funkcja /api/latest-video na Vercelu). Gdy nie odpowie, zostaje link wpisany ręcznie w "yt". */
fetch('/api/latest-video').then(r=>r.ok?r.json():null).then(v=>{
  if(!v||!v.id)return;
  const it=SECTIONS.find(s=>s.id==='polecane').items.find(i=>'yt' in i);
  if(!it)return;
  it.yt='https://www.youtube.com/watch?v='+v.id; it.s2=v.title||it.s2;
  const cur=[...tabsEl.children].find(b=>b.getAttribute('aria-selected')==='true');
  if(cur&&cur.dataset.id==='polecane')render('polecane');
}).catch(()=>{});

/* ===== Sprite: 8-bitowy Kuba (szkielet + piksele) ===== */
const PAL={
  H:'#3a2416',h:'#5e3a22',S:'#f0b48a',s:'#c98e6a',B:'#4f2e1b',K:'#140f1c',
  G:'#2f8a3e',g:'#1d6129',D:'#1d1d26',d:'#0e0e14',W:'#efefef',w:'#b9b6c2',
  N:'#3c4262',n:'#262a42',O:'#ff7a1a',o:'#c25a10',T:'#3fa7a0',t:'#2c7c77',
  // dzik
  b:'#4a3122',X:'#6e4c33',p:'#d39a86',I:'#f3ead2',
  // przeszkody
  C:'#f3f1ea',c:'#2f8a3e',Y:'#f7d23e',y:'#c9a21f',k:'#5a3a12'
};
const HEAD=[
 "........H..H.h",
 ".......HHhHHHH",
 ".....HHHHHHHHhH",
 "......hHHHHHHHH",
 "......HHHSSSKS",
 "......HHsSSSSSS",
 "......HBSSSSBB",
 "......HBBBBBBBB",
 ".......BBBBBBB",
 "........BBBBB",
 ".........SS"];
const TORSO=[
 ".......GGGGGG",
 ".......GGGGGG",
 ".......GGGGGG",
 ".......GGGGGG",
 ".......gGGGGg",
 ".......DDDDDD",
 ".......DDDDDD"];
const GW=22, GH=32, R=Math.PI/180;

function newGrid(w,h){return Array.from({length:h},()=>Array(w).fill('.'))}
function outline(g){
  const h=g.length,w=g[0].length,out=g.map(r=>r.slice());
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(g[y][x]!=='.')continue;
    if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>g[y+dy]&&g[y+dy][x+dx]&&g[y+dy][x+dx]!=='.'))out[y][x]='K';
  }
  return out;
}
function toCanvas(g){
  const c=document.createElement('canvas');c.width=g[0].length;c.height=g.length;
  const x=c.getContext('2d');
  g.forEach((r,yy)=>r.forEach((ch,xx)=>{if(ch!=='.'){x.fillStyle=PAL[ch];x.fillRect(xx,yy,1,1)}}));
  return c;
}
function strings(g,rows,oy,ox=0){rows.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!=='.'&&g[y+oy]&&x+ox<g[0].length)g[y+oy][x+ox]=c}))}

function runFrame(p,pose){
  const g=newGrid(GW,GH+6);
  const put=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(g[y]&&x>=0&&x<GW)g[y][x]=c};
  const seg=(x0,y0,a,L,col)=>{
    const sx=Math.sin(a*R),cy=Math.cos(a*R),thickX=Math.abs(cy)>=.55;
    for(let t=0;t<=L;t+=.5){const x=x0+t*sx,y=y0+t*cy,c=col(t);put(x,y,c);thickX?put(x+1,y,c):put(x,y+1,c)}
    return [x0+L*sx,y0+L*cy];
  };
  const leg=(ph,far)=>{
    const th=pose?pose.thigh*(far?-1:1):34*Math.sin(2*Math.PI*ph);
    const bend=pose?pose.bend:6+82*Math.pow(Math.max(0,Math.cos(2*Math.PI*(ph+.06))),1.4);
    const sh=th-bend;
    const hx=far?9:10, hy=17;
    const [kx,ky]=seg(hx,hy,th,5,t=>t<2?(far?'d':'D'):(far?'s':'S'));
    const [ax,ay]=seg(kx,ky,sh,4.5,t=>t>3.6?(far?'w':'W'):(far?'s':'S'));
    // but: 3 px w kierunku stopy
    const fa=Math.max(55,Math.min(125,sh+90));
    for(let t=0;t<=3;t+=.5){
      const x=ax+t*Math.sin(fa*R), y=ay+t*Math.cos(fa*R);
      put(x,y,far?'n':'N'); put(x,y+1,far?'o':'O');
    }
  };
  const arm=(ph,far)=>{
    const up=pose?pose.arm*(far?-1:1):-42*Math.sin(2*Math.PI*ph);
    const sx=far?9:10, sy=12;
    const [ex,ey]=seg(sx,sy,up,3.5,t=>t<1.5?(far?'g':'G'):(far?'s':'S'));
    seg(ex,ey,up+(pose?pose.fore:100),3,t=>t>1&&t<2?(far?'t':'T'):(far?'s':'S'));
  };
  arm(p+.5,true); leg(p+.5,true);
  strings(g,HEAD,0); strings(g,TORSO,11);
  leg(p,false); arm(p,false);
  // wyrównaj do ziemi: najniższy piksel = GH-2
  let maxY=0; g.forEach((r,y)=>{if(r.some(c=>c!=='.'))maxY=y});
  const shift=(GH-2)-maxY, g2=newGrid(GW,GH);
  g.forEach((r,y)=>{const ny=y+shift;if(ny>=0&&ny<GH)g2[ny]=r.slice()});
  return toCanvas(outline(g2));
}
const RUN=Array.from({length:8},(_,i)=>runFrame(i/8));
const JUMP=runFrame(0,{thigh:40,bend:70,arm:60,fore:70});
const FALL=runFrame(0,{thigh:20,bend:20,arm:120,fore:30});

/* dzik, kubek, skórka */
const BOAR_BODY=[
 ".......b.b.b............",
 ".....bbbbbbbbbbbb.......",
 "....bbXXXXXXXXXXXbb.....",
 "...bXXXXXXXXXXXXXXXb....",
 "..bKXXXXXXXXXXXXXXXXb.b.",
 ".pXXXXXXXXXXXXXXXXXXXbb.",
 "ppXXXXXXXXXXXXXXXXXXXb..",
 "pIXXXXXXXXXXXXXXXXXXb...",
 ".IXXXXXXXXXXXXXXXXXb....",
 "..XXXXXXXXXXXXXXXXX....."];
const BOAR=[
 BOAR_BODY.concat(["..bbb..bbb...bbb..bb....","..bb....bb....bb..bb....",".bb.....bb...bb...b....."]),
 BOAR_BODY.concat(["...bbb..bb..bbb...bb....","....bb..bb...bb..bb.....","....bb...bb..bb..bb....."])];
function spr(rows){const w=Math.max(...rows.map(r=>r.length))+2,g=newGrid(w,rows.length+2);strings(g,rows,1,1);return toCanvas(outline(g))}
const BOAR_F=BOAR.map(spr);
const CUP=spr([".CCc","CCCc",".CCc"]);

const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'};
function sky(h){
  let i=0;while(SKY[i+1][0]<=h)i++;
  const a=SKY[i],b=SKY[i+1],t=(h-a[0])/(b[0]-a[0]);
  return {top:mix(a[1],b[1],t),hor:mix(a[2],b[2],t),city:mix(a[3],b[3],t),win:a[4]+(b[4]-a[4])*t,stars:a[5]+(b[5]-a[5])*t,light:a[6]+(b[6]-a[6])*t};
}

function jump(){if(!paused&&y===0&&stun===0)vy=-2.6}
function userJump(){lastInput=t;jump()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(paused){setPause(false);return}userJump()});
const pauseBtn=document.getElementById('pause');
function setPause(v){paused=v;pauseBtn.setAttribute('aria-pressed',v);pauseBtn.innerHTML=v?'&#9654; Graj':'&#10074;&#10074; Pauza';document.getElementById('paused-label').hidden=!v}
pauseBtn.addEventListener('click',()=>setPause(!paused));
addEventListener('keydown',e=>{if(e.code==='KeyP'){setPause(!paused);return}if((e.code==='Space'||e.code==='ArrowUp')&&(e.target===document.body||e.target===cv)){e.preventDefault();userJump()}});

function spawn(){
  const rd=world-raceStart+LW+20;
  if(rd<120||rd>RACE_PX-120)return;
  const r=rnd2();
  const type=r<.4?'cup':r<.72?'peel':'boar';
  obstacles.push({type,x:world+LW+20,hit:false,miss:Math.random()<.1});
}
const rnd2=Math.random;

function px(){return Math.floor(Math.min(LW*.28,44))}
function hit(o){
  o.hit=true; falls++;
  if(o.type==='peel'){stun=55;stunType='slip'}
  else if(o.type==='boar'){stun=45;stunType='boar';vy=-2.4;y=-1}
  else {stun=20;stunType='trip'}
}

function update(){
  t++;
  const speed=stun>0?(stunType==='trip'?.55:.3):0.95;
  world+=speed;
  if(vy||y<0){vy+=.1;y+=vy;if(y>=0){y=0;vy=0}}
  if(stun>0)stun--;
  if(glow>0)glow--;
  // spawn
  if(world>nextSpawn){spawn();nextSpawn=world+90+rnd2()*140}
  obstacles.forEach(o=>{if(o.type==='boar')o.x-=.35});
  obstacles=obstacles.filter(o=>o.x-world>-30);
  const rx=px();
  for(const o of obstacles){
    const inset=o.type==='boar'?3:0, sx=o.x-world+inset, w=o.type==='boar'?18:o.type==='peel'?7:5, h=o.type==='boar'?11:3;
    // autopilot
    if(auto()&&!o.miss&&!o.hit&&y===0){
      const lead=o.type==='boar'?16:10;
      if(sx-(rx+14)<lead&&sx-(rx+14)>0)jump();
    }
    if(!o.hit&&stun===0&&sx<rx+14&&sx+w>rx+8&&-y<h)hit(o);
    if(!o.hit&&!o.cleared&&sx+w<rx+8){o.cleared=true;dodged++;glow=36}
  }
  // meta i nowy start
  const rd=world-raceStart;
  if(rd>=RACE_PX-rx-12&&finishedAt<0&&rd<RACE_PX+40){finishedAt=t;coins=[]}
  if(finishedAt>0&&t-finishedAt>660){raceStart=world+30;finishedAt=-1;falls=0;dodged=0;eggEl.hidden=true}
  if(finishedAt>0&&t-finishedAt===40){eggEl.hidden=false;track('finish')}
}

function arch(x,finish){
  ctx.fillStyle='#d9d4e6';ctx.fillRect(x,GROUND-34,2,34);ctx.fillRect(x+30,GROUND-34,2,34);
  for(let i=0;i<32;i++)for(let j=0;j<6;j++){
    ctx.fillStyle=finish?(((i>>1)+(j>>1))%2?'#140f1c':'#f3eee6'):(j<3?'#f3eee6':'#e0352b');
    ctx.fillRect(x+i,GROUND-38+j,1,1);
  }
}
const DIG={0:"111101101101111",1:"010110010010111",2:"111001111100111",3:"111001111001111",4:"101101111001001",5:"111100111001111",6:"111100111101111",7:"111001001001001",8:"111101111101111",9:"111101111001111"};
function num(n,x,y,col){ctx.fillStyle=col;String(n).split('').forEach((d,j)=>[...DIG[d]].forEach((p,q)=>{if(p==='1')ctx.fillRect(x+j*4+q%3,y+Math.floor(q/3),1,1)}))}

function draw(){
  const s=sky(hourNow());
  const grd=ctx.createLinearGradient(0,0,0,GROUND);grd.addColorStop(0,s.top);grd.addColorStop(1,s.hor);
  ctx.fillStyle=grd;ctx.fillRect(0,0,LW,GROUND);
  // gwiazdy
  if(s.stars>.05)STARS.forEach(([sx,sy,p])=>{if((Math.sin(t*.04+p*20)+1)/2<s.stars){ctx.fillStyle=p>.85?'#f2c14e':'#a49cc8';ctx.fillRect(Math.floor((sx-world*.03)%420+420)%420,Math.floor(sy),1,1)}});
  // słońce / księżyc
  const h=hourNow();
  if(h>5.8&&h<19.8){
    const k=(h-5.8)/14, sx=Math.floor(8+(LW-24)*k), sy=Math.floor(48-40*Math.sin(Math.PI*k));
    ctx.fillStyle=k<.12||k>.88?'#ffb36b':'#fff2b0';ctx.fillRect(sx,sy,8,8);ctx.fillRect(sx-1,sy+1,10,6);ctx.fillRect(sx+1,sy-1,6,10);
  } else {
    ctx.fillStyle='#efe6c8';ctx.fillRect(LW-24,8,7,7);ctx.fillRect(LW-25,9,9,5);ctx.fillStyle=s.top;ctx.fillRect(LW-21,7,5,5);
  }
  // chmury za dnia
  if(s.light>.3){ctx.fillStyle=`rgba(255,255,255,${.75*s.light})`;
    for(let i=0;i<4;i++){const cx=Math.floor(((i*97-world*.08)%(LW+60)+LW+60)%(LW+60)-30),cy=10+i*7%20;ctx.fillRect(cx,cy,16,3);ctx.fillRect(cx+4,cy-2,8,2)}}
  // miasto
  const off=(world*.25)%CITY_W;
  for(const kk of [0,1,2])for(const b of CITY){
    const bx=Math.floor(b.x-off+kk*CITY_W); if(bx>LW||bx+b.w<0)continue;
    ctx.fillStyle=s.city;ctx.fillRect(bx,GROUND-6-b.h,b.w,b.h);
    if(s.win>.05){ctx.fillStyle=`rgba(242,193,78,${s.win})`;
      b.win.forEach((on,i)=>{if(!on)return;const wx=bx+2+(i%3)*3,wy=GROUND-6-b.h+3+Math.floor(i/3)*4;if(wx<bx+b.w-1&&wy<GROUND-8)ctx.fillRect(wx,wy,1,2)})}
  }
  // drzewa / park
  ctx.fillStyle=mix('#14301e','#2f7a3e',s.light);
  TREES.forEach(tr=>{const tx=Math.floor(((tr.x-world*.6)%520+520)%520)-20;if(tx<LW)ctx.fillRect(tx,GROUND-6-tr.h,8,tr.h),ctx.fillRect(tx+2,GROUND-8-tr.h,4,2)});
  // barierki
  ctx.fillStyle='#d9d4e6';ctx.fillRect(0,GROUND-6,LW,4);
  ctx.fillStyle='#e0352b';for(let i=-(world%24);i<LW;i+=24)ctx.fillRect(Math.floor(i),GROUND-6,10,4);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,GROUND-2,LW,2);
  // asfalt
  ctx.fillStyle=mix('#232032','#5a5868',s.light);ctx.fillRect(0,GROUND,LW,LH-GROUND);
  ctx.fillStyle=mix('#2c293d','#6a6878',s.light);for(let i=-(world%6);i<LW;i+=6)ctx.fillRect(Math.floor(i),GROUND+6,1,1),ctx.fillRect(Math.floor(i)+3,GROUND+13,1,1);
  ctx.fillStyle='#e9e5dc';for(let i=-(world%20);i<LW;i+=20)ctx.fillRect(Math.floor(i),GROUND+10,10,1);
  // tablice km, start, meta
  const rs=raceStart-world;
  if(rs>-40&&rs<LW)arch(Math.floor(rs)-6,false);
  for(let km=1;km<=42;km++){
    const bx=Math.floor(rs+km*PX_KM); if(bx<-20||bx>LW)continue;
    ctx.fillStyle='#3a3358';ctx.fillRect(bx+7,GROUND-14,1,9);
    ctx.fillStyle='#f3eee6';ctx.fillRect(bx,GROUND-22,km>9?15:11,8);
    num(km,bx+2,GROUND-21,'#140f1c');
  }
  const fx=Math.floor(rs+RACE_PX);
  if(fx>-40&&fx<LW+10){
    arch(fx-16,true);
    for(let i=0;i<2;i++)for(let j=0;j<LH-GROUND;j++){ctx.fillStyle=(i+(j>>1))%2?'#140f1c':'#f3eee6';ctx.fillRect(fx+i*2,GROUND+j,2,1)}
  }
  // przeszkody
  for(const o of obstacles){
    const sx=Math.floor(o.x-world);
    if(o.type==='cup'){ctx.fillStyle='rgba(120,170,230,.55)';ctx.fillRect(sx-2,GROUND+4,9,1);ctx.drawImage(CUP,sx-1,GROUND-1)}
    else if(o.type==='peel')ctx.drawImage(PEEL,sx-1,GROUND)
    else ctx.drawImage(BOAR_F[Math.floor(t/7)%2],sx-1,GROUND-13);
  }
  // biegacz
  const rx=px();
  let spr=y<0?JUMP:RUN[Math.floor(t/6)%8];
  if(glow>0){
    const a=glow/36, cx=rx+11, cy=GROUND-14+Math.round(y);
    const gr=ctx.createRadialGradient(cx,cy,2,cx,cy,22);
    gr.addColorStop(0,`rgba(255,226,120,${.85*a})`);gr.addColorStop(.5,`rgba(95,211,154,${.45*a})`);gr.addColorStop(1,'rgba(95,211,154,0)');
    ctx.fillStyle=gr;ctx.fillRect(cx-24,cy-24,48,48);
    ctx.fillStyle=`rgba(255,242,176,${a})`;
    for(let i=0;i<6;i++){const ang=i*1.05+glow*.05,rr=8+(36-glow)*.45;ctx.fillRect(Math.round(cx+Math.cos(ang)*rr),Math.round(cy+Math.sin(ang)*rr*.8),1,1)}
  }
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(rx+5,GROUND+2,12,2);
  if(stun>0&&stunType==='slip'){
    ctx.save();ctx.translate(rx+11,GROUND+2);ctx.rotate(-Math.PI/2*Math.min(1,(55-stun)/8));ctx.drawImage(FALL,-11,-30);ctx.restore();
  } else if(!(stun>0&&stunType==='boar'&&t%6<3)){
    const jitter=stun>0&&stunType==='trip'?(t%4<2?-1:1):0;
    ctx.drawImage(stun>0&&stunType==='trip'?FALL:spr,rx+jitter,GROUND-GH+3+Math.round(y));
  }
  if(finishedAt>0)egg(t-finishedAt);
}


/* ===== Easter egg: złote kalesony na mecie ===== */
PAL.L='#fff6c2';PAL.Q='#fffdf0';PAL.U='#e8a810';PAL.u='#a86d06';
const KALESONY=spr([
 "LLLLLLLLLLLLLLLL",
 "QUUUUUUUUUUUUUUU",
 "YQYYYYYyYYYYYYYu",
 "YQYYYYYyYYYYYYYu",
 "YQYYYYyyyYYYYYYu",
 "YQYYYYyYyYYYYYYu",
 "YQYYYYY.YYYYYYYu",
 "YQYYYY....YYYYYu",
 "YQYYYu....YQYYYu",
 "YQYYYu....YQYYYu",
 "YQYYYu....YQYYYu",
 "YQYYYu....YQYYYu",
 "YQYYyu....YQYyYu",
 "YQYYYu....YQYYYu",
 "YQYYYu....YQYYYu",
 "YQYYYu....YQYYYu",
 "YQYYYu....YQYYYu",
 "YQYYYu....YQYYYu",
 "YQYyYu....YQYYyu",
 "YQYYYu....YQYYYu",
 "LLLLLL....LLLLLL",
 "UUUUUU....UUUUUU"]);
const eggEl=document.getElementById('egg');
let coins=[];
function egg(e){
  const cx=LW/2, cy=40;
  // przyciemnienie + wirujące promienie
  ctx.fillStyle=`rgba(20,8,0,${Math.min(.55,e/60)})`;ctx.fillRect(0,0,LW,LH);
  const rays=14, rot=e*.012, a=Math.min(1,e/40);
  for(let i=0;i<rays;i++){
    const a0=rot+i*2*Math.PI/rays, a1=a0+Math.PI/rays*.55;
    ctx.fillStyle=i%2?`rgba(255,214,80,${.32*a})`:`rgba(255,120,40,${.22*a})`;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a0)*240,cy+Math.sin(a0)*240);ctx.lineTo(cx+Math.cos(a1)*240,cy+Math.sin(a1)*240);ctx.fill();
  }
  const pulse=.6+.4*Math.sin(e*.15);
  const gr=ctx.createRadialGradient(cx,cy,2,cx,cy,46);
  gr.addColorStop(0,`rgba(255,250,200,${.95*a})`);gr.addColorStop(.35,`rgba(255,200,60,${.55*a*pulse})`);gr.addColorStop(1,'rgba(255,160,0,0)');
  ctx.fillStyle=gr;ctx.fillRect(cx-50,cy-50,100,100);
  // monety i błyski
  if(e<520&&e%2===0)for(let k=0;k<3;k++){const an=Math.random()*Math.PI*2,sp=.8+Math.random()*1.8;coins.push({x:cx,y:cy,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-1.2,l:0,c:Math.random()<.75?0:1})}
  coins.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.05;c.l++});
  coins=coins.filter(c=>c.y<LH+4&&c.l<200);
  coins.forEach(c=>{
    if(c.c){ctx.fillStyle=(c.l>>2)%2?'#ffffff':'#7ff0ff';ctx.fillRect(Math.round(c.x),Math.round(c.y)-1,1,3);ctx.fillRect(Math.round(c.x)-1,Math.round(c.y),3,1)}
    else{const w=[3,2,1,2][(c.l>>2)%4];ctx.fillStyle='#a86d06';ctx.fillRect(Math.round(c.x)-(w>>1),Math.round(c.y),w,3);ctx.fillStyle='#ffd23e';ctx.fillRect(Math.round(c.x)-(w>>1),Math.round(c.y),Math.max(1,w-1),2)}
  });
  // kalesony: spadają z nieba, odbijają się i lewitują
  const S=2, kw=KALESONY.width*S, kh=KALESONY.height*S;
  let ky;
  if(e<36){const p=e/36;ky=-kh+(cy-kh/2+kh)*p*p}
  else ky=cy-kh/2+Math.round(Math.sin((e-36)*.08)*2)-(e<48?Math.round(Math.sin((e-36)/12*Math.PI)*5):0);
  ctx.drawImage(KALESONY,Math.round(cx-kw/2),Math.round(ky),kw,kh);
  // błysk na tkaninie
  const sh=((e*1.5)%90)-20;
  if(e>36&&sh>-6&&sh<kw+6){ctx.fillStyle='rgba(255,255,255,.75)';for(let yy=0;yy<kh;yy+=1){const xx=Math.round(cx-kw/2+sh-yy*.4);if(xx>cx-kw/2+2&&xx<cx+kw/2-3)ctx.fillRect(xx,Math.round(ky)+yy,2,1)}}
  // kasynowe żarówki wokół ramki
  const bulbs=[];const st=6;
  for(let x=2;x<LW-2;x+=st)bulbs.push([x,1]);for(let y=1+st;y<LH-3;y+=st)bulbs.push([LW-3,y]);
  for(let x=LW-3-st;x>1;x-=st)bulbs.push([x,LH-3]);for(let y=LH-3-st;y>1;y-=st)bulbs.push([1,y]);
  const ph=Math.floor(e/4), cols=['#ff3b3b','#ffd23e','#3bff9a','#5ab0ff','#ff5ae0'];
  bulbs.forEach(([x,y],i)=>{const on=(i+ph)%4<2;ctx.fillStyle=on?cols[(i+Math.floor(e/16))%cols.length]:'#4a3412';ctx.fillRect(x,y,2,2);if(on){ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(x,y,1,1)}});
}

let lastHud='';
function hud(){
  const km=Math.max(0,Math.min(MARATHON,(world-raceStart+px()+12)/PX_KM));
  const d=new Date(), hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  const n=cv.clientWidth<480, k=finishedAt>0?'42,195':km.toFixed(1).replace('.',',');
  const txt=(finishedAt>0?'META! ':'')+(n?k+' / 42,195 km':(finishedAt>0?'':'KM ')+k+' / 42,195')+'|'+hh+':'+mm+(n?' · ✓'+dodged+' ✗'+falls:' · ominięte '+dodged+' · wywrotki '+falls)+'|'+(auto()?(n?'autopilot':'autopilot · klik = skok'):(n?'klik = skok':'grasz ty · klik = skok'));
  if(txt===lastHud)return;lastHud=txt;
  const [a,b,c]=txt.split('|');hudKm.textContent=a;hudClock.textContent=b;hudMode.textContent=c;
}
let acc=0,prev=performance.now();
function loop(now){
  acc+=Math.min(250,now-prev);prev=now;
  const STEP=1000/60;
  if(paused)acc=0;
  while(acc>=STEP){update();acc-=STEP;if(t%6===0)hud()}
  draw();
  if(paused){ctx.fillStyle='rgba(10,8,20,.55)';ctx.fillRect(0,0,LW,LH)}requestAnimationFrame(loop);
}
if(location.hash==='#meta')world=raceStart+RACE_PX-PX_KM*.4;
if(reduce){world=raceStart+PX_KM*12;draw();hud()}else requestAnimationFrame(n=>{prev=n;loop(n)});
</script>
